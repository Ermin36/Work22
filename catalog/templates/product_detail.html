{% extends 'base.html' %}

{% block header %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    {% block title %}
    <h1 class="display-4">{{product.name}}</h1>
    {% endblock %}
</div>
{% endblock %}

{% block data %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="table-responsive border rounded shadow-sm">
                <table class="table mb-0 align-middle">
                    <tbody>
                        <tr>
                            <th scope="row" class="fw-semibold text-end py-4 pe-4" style="width:140px;">Описание:</th>
                            <td class="py-4 ps-0 text-secondary">{{ product.description|truncatechars:100 }}</td>
                        </tr>
                        <tr>
                            <th scope="row" class="fw-semibold text-end py-4 pe-4">Цена:</th>
                            <td class="py-4 ps-0 fw-bold fs-3 text-primary">${{ product.price }}</td>
                        </tr>
                        <tr>
                            <th scope="row" class="fw-semibold text-end py-4 pe-4"></th>
                            <td class="py-4 ps-0">
                                <a href="{% url 'catalog:product_update' product.pk %}" class="btn btn-primary px-4 py-2 me-2">
                                    ✏️ Редактировать
                                </a>
                                <a href="{% url 'catalog:product_list' %}" class="btn btn-outline-secondary px-4 py-2">
                                    ← Назад к списку
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
