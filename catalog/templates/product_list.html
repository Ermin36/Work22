{% extends 'base.html' %}

{% block header %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    {% block title %}
    <h1 class="display-4">Список продуктов</h1>
    {% endblock %}
    <a href="{% url 'catalog:product_create' %}" class="btn btn-primary px-4 py-2 fw-bold">
            + Создать продукт
    </a>
</div>
{% endblock %}

{% block data %}
    <div class="row text-center">
        {% for item in products %}
        <div class="col-3">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">{{item.name}}</h4>
                </div>
                <div class="card-body">
                    <h1 class="card-title pricing-card-title">${{item.price}}</h1>
                    {% url 'catalog:product_detail' item.pk as data %}
                    <a role="button" class="btn btn-lg btn-outline-primary" href="{{data}}">Информация</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
{% endblock %}
