
{% extends 'base.html' %}

{% block data %}
<article class="py-5">
    <header class="mb-5 text-center">
        <!-- Показываем текущую картинку и даем возможность загрузить новую -->
        <div class="position-relative mb-4">
            {% if blog_post.image %}
                <img src="{{ blog_post.image.url }}" class="img-fluid rounded-4 shadow-lg"
                     alt="Текущее изображение поста" loading="lazy">
            {% else %}
                <div class="bg-light d-flex align-items-center justify-content-center rounded-4 shadow-sm"
                     style="min-height: 300px;">
                    Нет изображения
                </div>
            {% endif %}
            <!-- Кнопка загрузки (скрытое поле + label как кнопка) -->
            <label for="id_image" class="btn btn-sm btn-primary position-absolute bottom-3 end-3">
                Загрузить фото
                <input type="file" name="image" id="id_image" accept="image/*" class="d-none" onchange="this.form.submit()">
            </label>
        </div>

        <div class="d-flex justify-content-center gap-4 text-muted small">
            <span>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2L2 7v14h20V7L12 2zm0 15-5-2.5L7 12v-2h10v2l-1 2.5-5 2.5z"/>
                </svg>
                {{ blog_post.date_posted|date:"j F Y" }}
            </span>
            <span>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 11c-3.06 0-5.5-2.45-5.5-5.5S8.94 5 12 5s5.5 2.45 5.5 5.5S15.06 15.5 12 15.5z"/>
                </svg>
                {{ blog_post.number_views }} просмотров
            </span>
        </div>
    </header>

    <section class="row">
        <div class="col-lg-10 offset-lg-1">
            <!-- Форма редактирования -->
            <form method="post" enctype="multipart/form-data">

                <div class="mb-3">
                    <label class="form-label">Заголовок</label>
                    <input type="text" name="title" class="form-control" value="{{ blog_post.title }}">
                </div>

                <!-- Поле для контента (используем textarea вместо div) -->
                <div class="mb-4">
                    <label for="id_content" class="form-label fw-bold">Текст статьи</label>
                    <textarea name="content" id="id_content" rows="15" class="form-control" placeholder="Введите содержание поста...">{{ blog_post.content }}</textarea>
                </div>

                <hr class="my-4 border-top-0 border-bottom border-secondary">

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                    {% url 'blog:blog_detail' blog_post.pk as data %}
                    <a href="{{data}}" class="btn btn-outline-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </section>
</article>
{% endblock %}
